project:
  name: cra_hp
  protocol_version: "0.1"

reproducibility:
  seed: 20261117
  confirmatory_seeds: [20261117, 20261118, 20261119, 20261120, 20261121]

models:
  encoder:
    id: bert-base-uncased
    revision: 86b5e0934494bd15c9632b12f734a8a67f723594
    tokenizer_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  decoder:
    id: gpt2
    revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
    tokenizer_revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e

task:
  dataset: nyu-mll/glue
  config: sst2
  dataset_revision: bcdcba79d07bc864c1c254ccfcedcce55bcc9a8c
  source_train_split: train
  fit_fraction: 0.8
  checkpoint_selection_fraction: 0.1
  causal_calibration_fraction: 0.1
  train_holdout_seed: 20261117
  final_evaluation_split: validation
  test_split: test
  test_labels_available: false
  final_evaluation_note: "Use labeled validation as the untouched outer evaluation split; never use the unlabeled test split for signatures or selection."
  max_length: 128
  readout:
    bert: cls
    gpt2: last_non_padding_token
  note: "Readout semantics differ; document and run sensitivity analysis."

causal_intervention:
  exact_ablation: true
  gradient_proxy: true
  gate_location: head_output_before_output_projection
  calibration_sizes: [128, 512, 2048]
  report_prediction_flips: true
  report_margin_delta: true
  report_loss_delta: true

importance_transfer:
  methods:
    - random
    - same_index
    - unaligned_source
    - cka_aligned
    - causal_aligned
    - target_gradient
    - target_exact_ablation_oracle
  pruning_budgets: [0.1, 0.2, 0.3, 0.4]
  ranking_metrics: [spearman, kendall, top_k_overlap]
  evaluate_group_interactions: true

distribution_shift:
  enabled: true
  candidate_dataset: imdb
  calibration_split_only: true
  final_test_never_used_for_matching: true

physical_pruning:
  enabled_only_after_go_no_go: true
  ratios: [0.1, 0.2, 0.3, 0.4]
  recovery_finetuning_separate_condition: true
  benchmark:
    batch_sizes: [1, 8]
    sequence_lengths: [64, 128]
    warmup_steps: 20
    repetitions: 100

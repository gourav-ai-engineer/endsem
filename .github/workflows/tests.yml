name: research-foundation-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint source and tests
        run: ruff check src tests
      - name: Run tests
        run: pytest -q

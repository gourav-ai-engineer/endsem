[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-hp"
version = "0.1.0"
description = "Causal-response alignment for cross-architecture Transformer attention-head pruning research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
models = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "safetensors>=0.4,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
